name: Gifting Reviewer Image Provenance

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/gifting-budgeted-ai-review.yml'
      - '.github/workflows/gifting-ai-image-provenance.yml'

permissions:
  contents: read

jobs:
  verify-image:
    name: Verify PR-Agent immutable image provenance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve published multi-arch image digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          tag='pragent/pr-agent:0.41.0-github_action'
          digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Refuse an unexpected retag or registry/manifests discrepancy.
          test "$digest" = "sha256:3121a7b8e3ab497b4df09dea6a444da8f01a474496c8c2f722828512c52fd266"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Verified Docker manifest reference: pragent/pr-agent@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published image attestation against upstream repository
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://index.docker.io/pragent/pr-agent@${{ steps.digest.outputs.digest }}" --repo The-PR-Agent/pr-agent
