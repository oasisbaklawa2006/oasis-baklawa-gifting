name: Gifting One-Time Dependency Repair

# Limited to the dedicated remediation branch. This workflow is removed in its own
# successful commit, so it does not survive into the security-gate PR or main.
on:
  push:
    branches:
      - security/gifting-audit-remediation-20261111
    paths:
      - .github/workflows/gifting-one-time-dependency-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'oasisbaklawa2006/oasis-baklawa-gifting' && github.ref == 'refs/heads/security/gifting-audit-remediation-20261111'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact repair branch without cached credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Update vulnerable direct dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          bun update --latest --ignore-scripts @tanstack/react-start @tanstack/react-router @tanstack/router-plugin @lovable.dev/vite-tanstack-config vite
          bun add --ignore-scripts 'zod@^4.6.6'
          bun update --ignore-scripts
          bun install --frozen-lockfile --ignore-scripts
      - name: Verify high and critical advisories are resolved
        run: bun audit --audit-level high
      - name: Verify tracked-environment safety boundary
        run: node scripts/check-tracked-env.mjs
      - name: Verify critical regression-test inventory
        run: node scripts/check-critical-tests.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify exact changed-file scope
        shell: bash
        run: |
          set -euo pipefail
          git add package.json bun.lock
          git rm .github/workflows/gifting-one-time-dependency-repair.yml
          git diff --cached --name-only | sort > /tmp/gft-changes
          printf '%s\n' '.github/workflows/gifting-one-time-dependency-repair.yml' 'bun.lock' 'package.json' > /tmp/gft-allow
          diff -u /tmp/gft-allow /tmp/gft-changes
          git diff --cached --check
      - name: Commit only validated dependency repair to the dedicated branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): remediate Gifting high and critical audit advisories'
          gh auth setup-git
          git push origin HEAD:refs/heads/security/gifting-audit-remediation-20261111
