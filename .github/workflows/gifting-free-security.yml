name: Gifting Free Security Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gifting-free-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: npm audit (high and critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high --omit=optional

  semgrep:
    name: Semgrep security rules
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: semgrep/semgrep:1.144.0
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan TypeScript and JavaScript
        run: semgrep scan --config p/javascript --config p/typescript --config p/security-audit --error --metrics=off --exclude node_modules --exclude src/routeTree.gen.ts .
