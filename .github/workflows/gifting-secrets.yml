name: Gifting Secret Exposure Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: TruffleHog verified secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository for verified secrets
        uses: trufflesecurity/trufflehog@v3.93.3
        with:
          extra_args: --results=verified,unknown
